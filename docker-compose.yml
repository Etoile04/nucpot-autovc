version: "3.8"
services:
  api:
    build:
      context: .
      network: host
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      # LAMMPS now baked into the image (Debian arm64 lammps w/ MANYBODY).
      if [ ! -e /usr/local/bin/lmp_serial ] && [ -x /usr/bin/lmp ]; then
        ln -sf /usr/bin/lmp /usr/local/bin/lmp_serial
      fi
      mkdir -p /app/uploads
      mkdir -p /opt/deepmd/lib
      exec python -m uvicorn autovc.main:create_app --host 0.0.0.0 --port 8000 --factory
    ports:
    - 8002:8000
    environment:
    - HTTP_PROXY=http://host.docker.internal:7892
    - HTTPS_PROXY=http://host.docker.internal:7892
    - http_proxy=http://host.docker.internal:7892
    - https_proxy=http://host.docker.internal:7892
    - NO_PROXY=localhost,127.0.0.1,redis,host.docker.internal
    - no_proxy=localhost,127.0.0.1,redis,host.docker.internal
    - LD_LIBRARY_PATH=/opt/deepmd/lib
    - LAMMPS_BIN=/usr/local/bin/lmp_serial
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
    - autovc-data:/app/data
    - autovc-uploads:/app/uploads
    - type: bind
      source: ./src
      target: /app/src
    - type: bind
      source: ./bin
      target: /app/bin
    - type: bind
      source: ./deepmd-plugin
      target: /opt/deepmd/lib
    depends_on:
    - redis
    restart: unless-stopped
  worker:
    build:
      context: .
      network: host
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      # LAMMPS now baked into the image (Debian arm64 lammps w/ MANYBODY).
      if [ ! -e /usr/local/bin/lmp_serial ] && [ -x /usr/bin/lmp ]; then
        ln -sf /usr/bin/lmp /usr/local/bin/lmp_serial
      fi
      mkdir -p /app/uploads
      mkdir -p /opt/deepmd/lib
      exec python -m celery -A autovc.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
    - HTTP_PROXY=http://host.docker.internal:7892
    - HTTPS_PROXY=http://host.docker.internal:7892
    - http_proxy=http://host.docker.internal:7892
    - https_proxy=http://host.docker.internal:7892
    - NO_PROXY=localhost,127.0.0.1,redis,host.docker.internal
    - no_proxy=localhost,127.0.0.1,redis,host.docker.internal
    - LD_LIBRARY_PATH=/opt/deepmd/lib
    - LAMMPS_BIN=/usr/local/bin/lmp_serial
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
    - autovc-data:/app/data
    - autovc-uploads:/app/uploads
    - type: bind
      source: ./src
      target: /app/src
    - type: bind
      source: ./bin
      target: /app/bin
    - type: bind
      source: ./deepmd-plugin
      target: /opt/deepmd/lib
    depends_on:
    - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    volumes:
    - redis-data:/data
    restart: unless-stopped
volumes:
  autovc-data: null
  autovc-uploads: null
  redis-data: null
networks:
  default:
    name: nucpot-prod_prod
    external: true
